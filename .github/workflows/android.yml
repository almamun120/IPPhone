name: Android CI

# Builds a DEBUG apk and a SIGNED RELEASE apk on every push / pull request,
# uploads both as workflow artifacts and (on main/master) publishes them as a GitHub Release.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Optional: provide your own signing key through repository secrets
      # (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
      # Without them the keystore committed in /keystore is used.
      - name: Prepare custom keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using custom keystore from secrets"
          else
            echo "Using the keystore from /keystore"
          fi

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk   dist/IPPhone-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/IPPhone-release-signed.apk
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IPPhone-debug-apk
          path: dist/IPPhone-debug.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: IPPhone-release-signed-apk
          path: dist/IPPhone-release-signed.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IPPhone build ${{ github.run_number }}
          body: |
            Automatic build of commit ${{ github.sha }}
            - IPPhone-release-signed.apk — signed release build (install this one)
            - IPPhone-debug.apk — debug build
          files: |
            dist/IPPhone-debug.apk
            dist/IPPhone-release-signed.apk
